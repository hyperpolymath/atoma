name: Atoma soundness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atoma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scalar:
    name: Scalar source proof gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Provision scalar proof profile
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends agda-bin=2.6.3-1build1 coq=8.18.0+dfsg-1build2 zstd
          bash scripts/atoma-download-zig.sh "$RUNNER_TEMP/scalar-zig"
          cd "$RUNNER_TEMP"
          curl --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 240 -fL --retry 1 https://github.com/leanprover/lean4/releases/download/v4.15.0/lean-4.15.0-linux.tar.zst -o scalar-lean.tar.zst
          echo 'af71a2569a9f68337de2434829b3008cd8e32c436e9cb6bd8c84a2c2ba3585c9  scalar-lean.tar.zst' | sha256sum -c -
          tar --zstd -xf scalar-lean.tar.zst
          echo "$RUNNER_TEMP/lean-4.15.0-linux/bin" >> "$GITHUB_PATH"
          mkdir -p "$GITHUB_WORKSPACE/build/scalar-proof-evidence"
          sha256sum scalar-lean.tar.zst > "$GITHUB_WORKSPACE/build/scalar-proof-evidence/lean-archive.sha256"
      - name: Agda then Lean and Coq, Cubical, source falsifiers
        run: bash scripts/atoma-scalar-proof-gate.sh
      - name: Universal decoder theory (Agda, Lean, Coq and Cubical)
        run: bash scripts/atoma-word-proof-gate.sh
      - name: Universal decoder source and imported encoder
        run: bash scripts/atoma-word-source-proof-gate.sh
      - name: Preserve canonical repository map for review
        run: |
          bash scripts/gen-repo-map.sh .
          cp docs/architecture/REPOSITORY-MAP.adoc build/scalar-proof-evidence/REPOSITORY-MAP.adoc
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: scalar-proof-evidence-${{ github.sha }}
          path: build/scalar-proof-evidence/
          if-no-files-found: error

  soundness:
    name: Atoma soundness gate
    needs: [scalar]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Provision pinned proof tools
        run: bash scripts/atoma-ci-toolchain.sh
      - name: Provision source-model replay tools
        run: bash scripts/atoma-ci-replay-toolchain.sh
      - name: Run required source, contract and proof checks
        run: bash scripts/atoma-gate.sh
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: atoma-evidence-${{ github.sha }}
          path: |
            build/atoma-evidence/
            examples/atoma/frame-v1/witness/
          if-no-files-found: error
          retention-days: 30

  gate:
    name: CI/gate
    needs: [soundness]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful source, contract and proof checks
        env:
          SOUNDNESS_RESULT: ${{ needs.soundness.result }}
        run: test "$SOUNDNESS_RESULT" = success
