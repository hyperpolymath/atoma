name: Atoma soundness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atoma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soundness:
    name: Atoma soundness gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Provision pinned proof tools
        run: bash scripts/atoma-ci-toolchain.sh
      - name: Run required source, contract and proof checks
        run: bash scripts/atoma-gate.sh
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: atoma-evidence-${{ github.sha }}
          path: |
            build/atoma-evidence/
            examples/atoma/frame-v1/witness/
          if-no-files-found: error
          retention-days: 30
