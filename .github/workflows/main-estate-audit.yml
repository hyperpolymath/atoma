name: Central Estate CI/CD Audit

# The called reusable declares `permissions: contents: read`; a caller must grant
# at least what the reusable declares, and this grants exactly that — no more.
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

jobs:
  call-estate-audit:
    uses: hyperpolymath/cicd-suite/.github/workflows/main-estate-audit.yml@2dbe6e9c2da71fbce336079f8e016c2de0b90111
    with:
      # Includes the frame FFI implementation and all its local Zig imports.
      zig-ffi-paths: examples/atoma/frame-v1/src
